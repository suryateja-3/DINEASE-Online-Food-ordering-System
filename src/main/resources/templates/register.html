<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DineEase</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{navbar :: navbar}"></div>

    <main class="auth-page">
        <div class="auth-card animate-fade-in" style="max-width: 540px;">
            <div class="auth-header">
                <span class="auth-logo">🍽️</span>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join us to save dining wait-times</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="9876543210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" id="address" class="form-input" placeholder="Street Name, City, State" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" required>
                </div>
                
                <button type="submit" class="btn btn-primary auth-btn">Register Account</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? 
                <a th:href="@{/login-page}">Login here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{footer :: footer}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>

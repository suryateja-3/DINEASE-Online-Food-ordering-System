<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - DineEase</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{navbar :: navbar}"></div>

    <main class="container" style="max-width: 600px; padding: 2rem 1rem;">
        <div class="glass-card animate-fade-in" id="profileContainer">
            <div style="text-align: center; margin-bottom: 2rem;">
                <span class="auth-logo">👤</span>
                <h1 class="auth-title">My Profile</h1>
                <p class="auth-subtitle" style="margin-top: 0.25rem;">User ID: <span id="userIdDisplay" style="font-weight: 700;">Loading...</span></p>
            </div>

            <form id="profileForm">
                <div class="form-group">
                    <label class="form-label" for="profileName">Full Name</label>
                    <input type="text" id="profileName" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profileEmail">Email Address</label>
                    <input type="email" id="profileEmail" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profilePhone">Phone Number</label>
                    <input type="tel" id="profilePhone" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profileAddress">Default Address</label>
                    <input type="text" id="profileAddress" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profilePassword">New Password (leave empty to keep existing)</label>
                    <input type="password" id="profilePassword" class="form-input" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">Save Profile Settings</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{footer :: footer}"></div>

    <!-- Scripts -->
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
